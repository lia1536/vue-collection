name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # 在 main 分支有推送时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在最新版的 Ubuntu 系统上运行

    steps:
    - uses: actions/checkout@v3 # 步骤1：检出代码

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # 使用 Node.js 18.x 版本

    - name: Install dependencies
      run: npm ci # 步骤2：安装依赖

    - name: Build
      run: npm run build # 步骤3：构建项目，生成 dist 文件夹

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist # 指定要部署的文件夹是 dist
        # 该 Action 会自动创建/更新 gh-pages 分支，并将其设置为 GitHub Pages 的源